# Feel free to remove those if you don't want/need to use them.
# Make sure to check the documentation at https://nfpm.goreleaser.com
#
# The lines below are called `modelines`. See `:help modeline`

name: "nocturne"
arch: ${GOARCH}
platform: "linux"
version: "1.0.0"
section: "net"
priority: "optional"
maintainer: "Nocturne Contributors"
description: "A private, cross-platform BitTorrent client"
vendor: "Nocturne Contributors"
license: "MIT"
release: "1"

contents:
  - src: "./bin/nocturne"
    dst: "/usr/bin/nocturne"
  - src: "./build/appicon.png"
    dst: "/usr/share/icons/hicolor/512x512/apps/nocturne.png"
  - src: "./build/linux/nocturne.desktop"
    dst: "/usr/share/applications/nocturne.desktop"
  - src: "./LICENSE"
    dst: "/usr/share/doc/nocturne/LICENSE"
  - src: "./THIRD_PARTY.md"
    dst: "/usr/share/doc/nocturne/THIRD_PARTY.md"
  - src: "./notices/"
    dst: "/usr/share/doc/nocturne/notices/"

# Default dependencies for the GTK4 + WebKitGTK 6.0 stack (Ubuntu 24.04+ / Debian 13+)
depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4

# Distribution-specific overrides for different package formats
overrides:
  # RPM packages for Fedora / RHEL / AlmaLinux / Rocky Linux
  rpm:
    depends:
      - gtk4
      - webkitgtk6.0

  # Arch Linux packages
  archlinux:
    depends:
      - gtk4
      - webkitgtk-6.0

# scripts section to ensure desktop database is updated after install
scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
  # You can also add preremove, postremove if needed
  # preremove: "./build/linux/nfpm/scripts/preremove.sh"
  # postremove: "./build/linux/nfpm/scripts/postremove.sh"

# If you build your app with -tags gtk3 (legacy WebKit2GTK 4.1 stack — supported through v3.0.x, removed in v3.1),
# replace the depends/overrides above with these:
#
# depends:
#   - libgtk-3-0
#   - libwebkit2gtk-4.1-0
# overrides:
#   rpm:
#     depends:
#       - gtk3
#       - webkit2gtk4.1
#   archlinux:
#     depends:
#       - gtk3
#       - webkit2gtk-4.1
#
# replaces:
#   - foobar
# provides:
#   - bar
# recommends:
#   - whatever
# suggests:
#   - something-else
# conflicts:
#   - not-foo
#   - not-bar
# changelog: "changelog.yaml"
