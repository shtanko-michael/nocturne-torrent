name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Stable SemVer version, for example 1.2.3"
        required: true
        type: string

permissions:
  contents: read

env:
  GO_VERSION: "1.25.0"
  NODE_VERSION: "24"
  WAILS_VERSION: "v3.0.0-alpha.96"

jobs:
  prepare:
    name: Validate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - id: version
        name: Resolve release version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            raw="$INPUT_VERSION"
          else
            raw="$REF_NAME"
          fi
          version="${raw#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release version must use stable SemVer format, got: $raw" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  test:
    name: Release checks
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-4-dev libwebkitgtk-6.0-dev
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pwsh ./scripts/set-version.ps1 -Version "${{ needs.prepare.outputs.version }}"
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - run: go test ./...
      - run: go vet ./...

  windows:
    name: Windows x64
    needs: [prepare, test]
    runs-on: windows-latest
    env:
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install packaging tools
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
          choco install nsis --yes --no-progress
      - name: Apply release version
        shell: pwsh
        run: ./scripts/set-version.ps1 -Version "${{ needs.prepare.outputs.version }}"
      - run: npm ci --prefix frontend
      - name: Build application
        shell: pwsh
        run: wails3 task windows:build ARCH=amd64
      - name: Sign application when a certificate is configured
        if: env.WINDOWS_CERTIFICATE_BASE64 != ''
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("certificate.pfx", [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          signtool sign /fd SHA256 /f certificate.pfx /p "$env:WINDOWS_CERTIFICATE_PASSWORD" /tr http://timestamp.digicert.com /td SHA256 bin/nocturne.exe
          Remove-Item -LiteralPath certificate.pfx -Force
      - name: Build per-user installer
        shell: pwsh
        run: |
          wails3 generate webview2bootstrapper -dir "$pwd/build/windows/nsis"
          Push-Location build/windows/nsis
          & makensis -DWAILS_INSTALL_SCOPE=user -DREQUEST_EXECUTION_LEVEL=user "-DARG_WAILS_AMD64_BINARY=$pwd\..\..\..\bin\nocturne.exe" project.nsi
          Pop-Location
      - name: Sign installer when a certificate is configured
        if: env.WINDOWS_CERTIFICATE_BASE64 != ''
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("certificate.pfx", [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          signtool sign /fd SHA256 /f certificate.pfx /p "$env:WINDOWS_CERTIFICATE_PASSWORD" /tr http://timestamp.digicert.com /td SHA256 bin/nocturne-amd64-installer.exe
          Remove-Item -LiteralPath certificate.pfx -Force
      - name: Assemble Windows artifacts
        shell: pwsh
        run: |
          $version = "${{ needs.prepare.outputs.version }}"
          $portable = "dist/Nocturne-$version-windows-x64-portable"
          New-Item -ItemType Directory -Force -Path $portable | Out-Null
          Copy-Item bin/nocturne.exe "$portable/Nocturne.exe"
          Copy-Item README.md, LICENSE, THIRD_PARTY.md -Destination $portable
          Copy-Item notices -Destination "$portable/notices" -Recurse
          Compress-Archive -Path "$portable/*" -DestinationPath "dist/Nocturne-$version-windows-x64-portable.zip"
          Copy-Item bin/nocturne-amd64-installer.exe "dist/Nocturne-$version-windows-x64-installer.exe"
          Remove-Item -LiteralPath $portable -Recurse -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*
          if-no-files-found: error

  macos:
    name: macOS (${{ matrix.arch }})
    needs: [prepare, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: amd64
    runs-on: ${{ matrix.runner }}
    env:
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
      - name: Apply release version
        run: pwsh ./scripts/set-version.ps1 -Version "${{ needs.prepare.outputs.version }}"
      - run: npm ci --prefix frontend
      - name: Build app bundle
        run: wails3 task darwin:package ARCH=${{ matrix.arch }}
      - name: Apply Developer ID signature when configured
        if: env.APPLE_CERTIFICATE_BASE64 != '' && env.APPLE_SIGNING_IDENTITY != ''
        shell: bash
        run: |
          certificate_path="$RUNNER_TEMP/nocturne-certificate.p12"
          keychain_path="$RUNNER_TEMP/nocturne-signing.keychain-db"
          keychain_password="$(uuidgen)"
          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security list-keychain -d user -s "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain_path"
          codesign --force --deep --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" bin/nocturne.app
          codesign --verify --deep --strict --verbose=2 bin/nocturne.app
          rm -f "$certificate_path"
      - name: Assemble macOS artifacts
        shell: bash
        run: |
          version="${{ needs.prepare.outputs.version }}"
          portable="dist/Nocturne-$version-macos-${{ matrix.arch }}-portable"
          image="dist/Nocturne-$version-macos-${{ matrix.arch }}-image"
          mkdir -p "$portable/notices" "$image/notices"
          mv bin/nocturne.app bin/Nocturne.app
          cp -R bin/Nocturne.app "$portable/Nocturne.app"
          cp README.md LICENSE THIRD_PARTY.md "$portable/"
          cp notices/* "$portable/notices/"
          ditto -c -k --sequesterRsrc "$portable" "dist/Nocturne-$version-macos-${{ matrix.arch }}-portable.zip"
          cp -R bin/Nocturne.app "$image/Nocturne.app"
          cp LICENSE THIRD_PARTY.md "$image/"
          cp notices/* "$image/notices/"
          hdiutil create -volname Nocturne -srcfolder "$image" -ov -format UDZO "dist/Nocturne-$version-macos-${{ matrix.arch }}.dmg"
          rm -rf "$portable" "$image"
      - name: Notarize DMG when credentials are configured
        if: env.APPLE_ID != '' && env.APPLE_TEAM_ID != '' && env.APPLE_APP_PASSWORD != '' && env.APPLE_CERTIFICATE_BASE64 != ''
        shell: bash
        run: |
          dmg="dist/Nocturne-${{ needs.prepare.outputs.version }}-macos-${{ matrix.arch }}.dmg"
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  linux:
    name: Linux x64
    needs: [prepare, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential libgtk-4-dev libwebkitgtk-6.0-dev rpm
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
      - name: Apply release version
        run: pwsh ./scripts/set-version.ps1 -Version "${{ needs.prepare.outputs.version }}"
      - run: npm ci --prefix frontend
      - name: Build application
        run: wails3 task linux:build ARCH=amd64
      - name: Build Linux installers
        env:
          GOARCH: amd64
        run: |
          wails3 task linux:generate:dotdesktop
          wails3 task linux:generate:deb
          wails3 task linux:generate:rpm
      - name: Assemble Linux artifacts
        shell: bash
        run: |
          version="${{ needs.prepare.outputs.version }}"
          portable="dist/Nocturne-$version-linux-x64-portable"
          mkdir -p "$portable/notices"
          install -m 0755 bin/nocturne "$portable/nocturne"
          cp README.md LICENSE THIRD_PARTY.md "$portable/"
          cp notices/* "$portable/notices/"
          tar -C dist -czf "dist/Nocturne-$version-linux-x64-portable.tar.gz" "Nocturne-$version-linux-x64-portable"
          rm -rf "$portable"
          find bin -maxdepth 1 -type f -name '*.deb' -exec cp {} "dist/Nocturne-$version-linux-x64.deb" \;
          find bin -maxdepth 1 -type f -name '*.rpm' -exec cp {} "dist/Nocturne-$version-linux-x64.rpm" \;
          test -f "dist/Nocturne-$version-linux-x64.deb"
          test -f "dist/Nocturne-$version-linux-x64.rpm"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [prepare, windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* --target "$GITHUB_SHA" --title "Nocturne $VERSION" --generate-notes
          fi
